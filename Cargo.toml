[package]
name = "nexus-music"
version = "0.41.0"
edition = "2024"
description = "A fast native music player for Navidrome"
publish = false

# The app, and the library both apps are built on (core/). The jam relay (relay/) is a
# project of its own, with its own lock file and image.
[workspace]
members = ["core"]
default-members = [".", "core"]
exclude = ["relay", "server"]

[dependencies]
# What every app on an account must do identically. It has no window, starts no threads and
# opens no connections; it is compiled into the app like any other dependency.
nexus-core = { path = "core" }
slint = { version = "1.19", default-features = false, features = [
    "std", "backend-winit", "renderer-skia", "renderer-software",
    "accessibility", "compat-1-2", "system-tray", "raw-window-handle-06",
] }
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "json"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = [
    "mp3", "flac", "aac", "alac", "vorbis", "pcm", "adpcm",
    "isomp4", "ogg", "wav", "aiff", "mkv", "caf", "all-meta", "opt-simd",
] }
cpal = "0.18"
rubato = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
md-5 = "0.11"
sha2 = "0.11"
directories = "6"
fastrand = "2"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
getrandom = "0.3"
# Wipes a password or a session from memory when it is let go of (src/nexus/).
zeroize = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.9", default-features = false }
keyring = "4"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia", "Win32_Security", "Win32_System_Com",
    "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.19"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
