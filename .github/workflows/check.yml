# Compiles the app and the library it is built on (core/), and runs the tests of both, on
# every push to main or to a working branch (t3/...) and on every pull request: on Linux,
# where the app is developed, and on Windows, where it is used (the tests that write and
# replace files need to be seen passing on the file system people's settings live on).
# The Windows release itself is built and published by scripts/release.
name: Check

on:
  push:
    branches: [main, "t3/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same Rust version as docker/dev.Dockerfile.
  RUST_VERSION: "1.100.0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install what the Linux build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build python3 clang lld llvm \
            libasound2-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libdbus-1-dev libssl-dev

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Keep build output between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            check-${{ runner.os }}-${{ env.RUST_VERSION }}-

      # What the compiler cannot see: a cell of the controller borrowed twice at once, which
      # closes the released app (see the top of scripts/borrow-audit.py).
      - name: Audit the borrows
        run: python3 scripts/borrow-audit.py --self-test && python3 scripts/borrow-audit.py

      - name: Build
        run: cargo build --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

      - name: Test the jam relay
        run: cargo test --locked --manifest-path relay/Cargo.toml

      - name: Test the Nexus server
        run: cargo test --locked --manifest-path server/Cargo.toml

  windows:
    name: Test on Windows
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Keep build output between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            check-${{ runner.os }}-${{ env.RUST_VERSION }}-

      # (The same source is read on Linux; here it shows the script runs where the app is
      # used, with that system's Python and its way of reading files.)
      - name: Audit the borrows
        shell: bash
        run: python scripts/borrow-audit.py --self-test && python scripts/borrow-audit.py

      - name: Test
        shell: bash
        run: cargo test --locked --workspace
