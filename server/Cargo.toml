[package]
name = "nexus-music-server"
version = "0.1.0"
edition = "2024"
description = "The Nexus server: one small service of our own beside the music server"
publish = false

# Built by itself, apart from the app, as the relay is:
# `cargo build --manifest-path server/Cargo.toml`. It links the shared library, so that the
# backend and the apps read the same words the same way (backend design, R4).
[workspace]

[dependencies]
nexus-core = { path = "../core" }
# Durable Requests jobs and batch progress use typed JSON in SQLite.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The runtime the listener, its deadlines and each request's own task run on.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
# The HTTP/1 connection itself, served one connection at a time with its bounds set by hand:
# the deadline for a request's head, the size of a head, the number of its headers.
hyper = { version = "1", default-features = false, features = ["server", "client", "http1"] }
# Reading and judging a request's head before hyper sees a byte of it, so that nothing is
# written before the gate has passed. The parser hyper itself uses (already in the lock).
httparse = "1"
# hyper's link to tokio: its sockets and its timer.
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# Routing a request, once it has passed the bounds, to what answers it.
axum = { version = "0.8", default-features = false }
# Calling the router as a service (axum depends on it already, with this same feature).
tower = { version = "0.5", default-features = false, features = ["util"] }
# Reading a body no larger than its bound (axum depends on it already).
http-body-util = "0.1"
# The backend's id, made at random when its store is first made. The version the relay uses.
getrandom = "0.3"
# The data (design 13.1): SQLite, through rusqlite, with SQLite built into the program
# (`bundled`), so that the SQLite the data is written by is the one tested, whatever the
# container has. `backup`: SQLite's own way of copying a database in use, for the nightly copy
# and for putting a copy back (13.4). Nothing else: no cache of statements, no extensions.
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "backup"] }
# The store kept apart's check sum, and the fingerprint it keeps of an account's name. The
# version the shared library uses (already in the lock).
sha2 = "0.11"
# Passwords (design 8.2): Argon2id, 19 MiB, two passes, one lane, done by the two workers of
# `accounts::check` (S8b) into memory they wipe (`zeroize`; `alloc` for the blocks).
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1.8"
subtle = { version = "2", default-features = false }
# The keyed fingerprint a one-time code is kept by (8.5), the version the shared library uses.
hmac = "0.13"
# Asking the music server whether a typed-in login works (9.3, S9): its address read as the
# shared library reads it (already in the lock); HTTPS to the address people use, by rustls with
# ring (no C toolchain beyond ring's own), trusting this machine's certificates
# (`rustls-native-certs`, which also takes `SSL_CERT_FILE`).
url = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
# The music check deadline is tested on a paused clock.
tokio = { version = "1", default-features = false, features = ["test-util"] }
# Tests connect from a chosen loopback address (127.0.0.2 as the proxy, 127.0.0.3 as a
# stranger), which the standard library cannot bind a client to. The relay uses it already.
socket2 = "0.6"
# A certificate made for a test's own HTTPS stand-in (the music server's client, S9).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# Argon2id is the slow work it is meant to be, and no slower: 19 MiB and two passes take
# seconds unoptimised, past the answer's deadline, so its crates are optimised in tests too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# (Not `panic = "abort"`: a fault in one request is caught and outlived, which needs the
# program to be able to unwind.)
