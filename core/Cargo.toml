[package]
name = "nexus-core"
version = "0.0.0"
edition = "2024"
description = "The parts of Nexus Music that every app on an account must do identically"
publish = false

# No window, no threads of its own and no network code: this is what lets one copy of it
# serve the Windows app and the Android app. Anything added here has to keep that true.
[dependencies]
serde = { version = "1", features = ["derive"] }
# (`raw_value`: a field of the shared record that this version doesn't know is kept as the
# text it was written as, and written back so. See src/record.rs.)
serde_json = { version = "1", features = ["raw_value"] }
# Reading the two kinds of time a server sends: when a saved queue was changed, and the
# `Date` on an answer. The app carries chrono already; none of its clock is used here, so
# the library still has no clock of its own.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Linking a person's devices (src/link.rs). The seal on what they say to each other, the
# key it is sealed with, and wiping both. No source of randomness comes with any of these:
# an app hands the random bytes in.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hkdf = "=0.13.0"
sha2 = "0.11"
zeroize = "1.8"
